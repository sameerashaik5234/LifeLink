<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Login - LifeLink</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .navbar {
            background: #8b0000;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            max-width: 480px;
            margin: 80px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            color: #8b0000;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d9e2;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #8b0000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #650000;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #8b0000;
            font-weight: bold;
            text-decoration: none;
        }

        .flash {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #ffe5e5;
            color: #8b0000;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">🩸 LifeLink</div>
    <div>Hospital Portal</div>
</div>

<div class="container">

    <div class="card">

        <h1>🏥 Hospital Login</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Hospital email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register">
            New hospital?
            <a href="{{ url_for('hospital_register') }}">
                Register here
            </a>
        </div>

    </div>

</div>

</body>
</html>
