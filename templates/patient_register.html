<!DOCTYPE html>
<html>
<head>
    <title>LifeLink - Patient Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
        }

        .header {
            background: #b00000;
            color: white;
            padding: 18px 40px;
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #b00000;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #e31b23;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #e31b23;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    🩸 LifeLink
</div>

<div class="container">

    <h2>Patient Registration</h2>

    <form method="POST">

        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Phone</label>
        <input type="text" name="phone" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>City</label>
        <input type="text" name="city" required>

        <button type="submit">
            Register as Patient
        </button>

    </form>

    <div class="login">
        Already registered?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
