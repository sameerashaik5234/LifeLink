<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Registration - LifeLink</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .navbar {
            background: #8b0000;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #8b0000;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d9e2;
            border-radius: 9px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #8b0000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #650000;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #8b0000;
            font-weight: bold;
            text-decoration: none;
        }

        .flash {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #ffe5e5;
            color: #8b0000;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">🩸 LifeLink</div>
    <div>Hospital Registration</div>
</div>

<div class="container">

    <div class="card">

        <h1>🏥 Register Hospital</h1>

        <p class="subtitle">
            Create a hospital account for the LifeLink prototype.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Hospital Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter hospital name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="hospital@example.com"
                required
            >

            <label>Phone</label>
            <input
                type="tel"
                name="phone"
                placeholder="Enter hospital phone"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >

            <label>Address</label>
            <textarea
                name="address"
                placeholder="Enter complete hospital address"
                required
            ></textarea>

            <label>City</label>
            <select name="city" required>
                <option value="">Select City</option>
                <option value="Pulivendula">Pulivendula</option>
                <option value="Kadapa">Kadapa</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Bengaluru">Bengaluru</option>
                <option value="Vijayawada">Vijayawada</option>
                <option value="Tirupati">Tirupati</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit">
                Register Hospital
            </button>

        </form>

        <div class="login-link">
            Already registered?
            <a href="{{ url_for('hospital_login') }}">
                Hospital Login
            </a>
        </div>

    </div>

</div>

</body>
</html>
