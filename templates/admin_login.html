<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - LifeLink</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #8b0000, #111827);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #b91c1c;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        h2 {
            text-align: center;
            color: #111827;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #b91c1c;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #b91c1c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #991b1b;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #b91c1c;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🩸 LifeLink</div>

        <div class="subtitle">
            Smart Blood Donor & Emergency Assistance System
        </div>

        <h2>Admin Login</h2>

        <form method="POST">

            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">
                Login as Admin
            </button>

        </form>

        <div class="back">
            <a href="/">← Back to Home</a>
        </div>

    </div>

</body>
</html>
